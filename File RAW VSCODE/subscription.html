    <link rel="stylesheet" href="commonstyle.css">
    <style>
        .profile-wrapper { max-width: 600px; margin: 60px auto; padding: 20px; }
        .profile-card {
            background-color: #13162d;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
        }
        .avatar {
            width: 100px;
            height: 100px;
            background-color: #ff0066;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }
        .profile-details { margin-top: 20px; text-align: left; }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #1f2347;
        }
        .detail-label { color: #a0a5c0; }
    </style>
