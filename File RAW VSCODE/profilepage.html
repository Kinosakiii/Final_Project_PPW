<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movieto - Profile</title>
    <link rel="stylesheet" href="commonstyle.css">
    <style>
        .profile-wrapper { max-width: 600px; margin: 60px auto; padding: 20px; }
        .profile-card {
            background-color: #13162d;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
        }
        .avatar {
            width: 100px;
            height: 100px;
            background-color: #ff0066;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }
        .profile-details { margin-top: 20px; text-align: left; }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #1f2347;
        }
        .detail-label { color: #a0a5c0; }
    </style>
</head>
<body>

    <header class="header">
        <a href="homepage.html" class="logo"><span>W</span>owo Movies</a>
        <nav class="nav">
            <a href="homepage.html" class="nav-link">Home</a>
            <a href="moviepage.html" class="nav-link">Movies</a>
            <a href="profilepage.html" class="nav-link active">Profile</a>
            <a href="settings.html" class="nav-link">Settings</a>
            <a href="subschoice.html" class="nav-link">Subscription</a>
        </nav>
    </header>

    <div class="profile-wrapper">
        <div class="profile-card">
            <div class="avatar">O</div>
            <h3>SawitMan67</h3>
            <p style="color: #a0a5c0; font-size: 14px;">Member since 2026</p>
            
            <div class="profile-details">
                <div class="detail-row">
                    <span class="detail-label">Email</span>
                    <span>sawitman67@example.com</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Subscription Tier</span>
                    <span style="color: #ff0066; font-weight: bold;">Premium Ultra</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Status</span>
                    <span style="color: #00ff88;">Active</span>
                </div>
            </div>
                <div class="detail-row">
                <span class="detail-label">Subscription</span>
                <p style="color:#a0a5c0; text-align: right;"><small><i>Please remember to check your subscription</i></small></p>
                <a href="subscription.html" class="nav-link active">Check</a>
                </div>
        </div>
    </div>

</body>
</html>
