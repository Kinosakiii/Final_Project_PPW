<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wowo Movies - Register Page</title>
    <link rel="stylesheet" href="commonstyle.css">
</head>
<body>

    <header class="header">
        <a href="homepage.html" class="logo"><span>W</span>owo Movies</a>
    </header>

    <div class="auth-container">
        <h2>Create Account</h2>
        <form action="login.html">

            <div class="form-group">

                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Your username">
            </div>


            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Create secure password">
            </div>
            <button type="submit" class="auth-btn">Register</button>
        </form>
        <div class="auth-switch">
            Already have an account? <a href="login.html">Sign In</a>
        </div>


    </div>

</body>
</html>
